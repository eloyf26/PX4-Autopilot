<rect x="40" y="390.5" width="560" height="82" fill="#fffbea" stroke="#a16207" stroke-width="1" rx="0"/>
<text x="48" y="406.5" font-size="9.5" fill="#5a4300" text-anchor="start" font-weight="400">Two SPI buses cross the flex: SPI3 (BMI088: separate accel and gyro chip selects, gyro INT3 as DRDY)</text>
<text x="48" y="420.5" font-size="9.5" fill="#5a4300" text-anchor="start" font-weight="400">and SPI2 (ICM-42688-P: one chip select, INT2 as DRDY). Both run at up to 10 MHz, so every signal has a GND neighbour.</text>
<text x="48" y="434.5" font-size="9.5" fill="#5a4300" text-anchor="start" font-weight="400">I2C4 (PF14/PF15) reaches the IMU board for RM3100 (0x20), ICP-20100 #1 (0x63/0x64), and the 24LC64 cal EEPROM (0x50).</text>
<text x="48" y="448.5" font-size="9.5" fill="#5a4300" text-anchor="start" font-weight="400">Three switched 3.3 V rails cross (SENSORS2/3/4) plus raw VDD_5V_IN for the heater resistors; HEATER is the control line.</text>
<text x="48" y="462.5" font-size="9.5" fill="#5a4300" text-anchor="start" font-weight="400">Pinout is taken from DS-012 p.17 (the standard flex pinout); CUAV&#x27;s silkscreen &#x27;FLEX&#x27; and connector position match the reference.</text>
</svg>